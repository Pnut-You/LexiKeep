name: Build Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform(s) to build (all / macos / windows / linux / android)'
        type: choice
        options:
          - all
          - macos
          - windows
          - linux
          - android
        default: all
      draft:
        description: 'Create the GitHub release as a draft (updates stay invisible until published)'
        type: boolean
        default: false

jobs:
  macos:
    name: macOS (Apple Silicon / Intel)
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'macos' }}
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
          - target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NODE_OPTIONS: --use-system-ca
        with:
          tagName: v__VERSION__
          releaseName: 'LexiKeep v__VERSION__'
          releaseBody: |
            ## LexiKeep v1.1.1

            - 修复更新 yt-dlp 后应用仍缓存旧路径的问题
            - 提高 YouTube 视频与字幕信息解析超时上限
            - 增强新版与旧版 yt-dlp 的视频元数据兼容性
            - HTTP 回退失败时保留真正的 yt-dlp 错误，方便排查
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: false
          retryAttempts: 2
          args: --target ${{ matrix.target }} --bundles app,dmg

  windows:
    name: Windows Installer
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'windows' }}
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NODE_OPTIONS: --use-system-ca
        with:
          tagName: v__VERSION__
          releaseName: 'LexiKeep v__VERSION__'
          releaseBody: |
            ## LexiKeep v1.1.1

            - 修复更新 yt-dlp 后应用仍缓存旧路径的问题
            - 提高 YouTube 视频与字幕信息解析超时上限
            - 增强新版与旧版 yt-dlp 的视频元数据兼容性
            - HTTP 回退失败时保留真正的 yt-dlp 错误，方便排查
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: false
          retryAttempts: 2
          updaterJsonPreferNsis: true
          args: --bundles nsis

  linux:
    name: Linux (.deb)
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'linux' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NODE_OPTIONS: --use-system-ca
        with:
          tagName: v__VERSION__
          releaseName: 'LexiKeep v__VERSION__'
          releaseBody: |
            ## LexiKeep v1.1.1

            - 修复更新 yt-dlp 后应用仍缓存旧路径的问题
            - 提高 YouTube 视频与字幕信息解析超时上限
            - 增强新版与旧版 yt-dlp 的视频元数据兼容性
            - HTTP 回退失败时保留真正的 yt-dlp 错误，方便排查
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: false
          retryAttempts: 2
          args: --bundles deb

  android:
    name: Android APK
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'android' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264"
          yes | sdkmanager --licenses > /dev/null
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate Android project
        run: npx tauri android init
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --use-system-ca
        with:
          tagName: v__VERSION__
          releaseName: 'LexiKeep v__VERSION__'
          releaseBody: |
            ## LexiKeep v1.1.1

            - 修复更新 yt-dlp 后应用仍缓存旧路径的问题
            - 提高 YouTube 视频与字幕信息解析超时上限
            - 增强新版与旧版 yt-dlp 的视频元数据兼容性
            - HTTP 回退失败时保留真正的 yt-dlp 错误，方便排查
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: false
          retryAttempts: 1
          mobile: android
          args: --apk --target aarch64
