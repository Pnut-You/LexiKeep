name: Build Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform(s) to build (all / macos / windows / linux / android)'
        type: choice
        options:
          - all
          - macos
          - windows
          - linux
          - android
        default: all
      draft:
        description: 'Create the GitHub release as a draft (updates stay invisible until published)'
        type: boolean
        default: false

jobs:
  macos:
    name: macOS (Apple Silicon / Intel)
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'macos' }}
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
          - target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NODE_OPTIONS: --use-system-ca
        with:
          tagName: v__VERSION__
          releaseName: 'LexiKeep v__VERSION__'
          releaseBody: |
            ## LexiKeep v1.1.8

            - 单词页全选现在覆盖当前筛选和搜索结果的全部分页
            - 支持批量或右键将单词从个人列表删除
            - 删除个人单词不会删除文件解析位置或词典数据

            - 修复阅读页无法从下拉列表选择文件夹内文件的问题
            - 阅读页中带下划线的词组现在支持右键快速修改状态
            - 删除文件时自动清理不再被其他文件引用的单词
            - 其他文件仍在使用的单词会保留其学习状态、释义和复习记录
            - Linux、macOS 和 Windows 支持应用内检查、安装更新并自动重启
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: false
          retryAttempts: 2
          args: --target ${{ matrix.target }} --bundles app,dmg

  windows:
    name: Windows Installer
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'windows' }}
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NODE_OPTIONS: --use-system-ca
        with:
          tagName: v__VERSION__
          releaseName: 'LexiKeep v__VERSION__'
          releaseBody: |
            ## LexiKeep v1.1.8

            - 单词页全选现在覆盖当前筛选和搜索结果的全部分页
            - 支持批量或右键将单词从个人列表删除
            - 删除个人单词不会删除文件解析位置或词典数据

            - 修复阅读页无法从下拉列表选择文件夹内文件的问题
            - 阅读页中带下划线的词组现在支持右键快速修改状态
            - 删除文件时自动清理不再被其他文件引用的单词
            - 其他文件仍在使用的单词会保留其学习状态、释义和复习记录
            - Linux、macOS 和 Windows 支持应用内检查、安装更新并自动重启
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: false
          retryAttempts: 2
          updaterJsonPreferNsis: true
          args: --bundles nsis

  linux:
    name: Linux (.deb)
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'linux' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NODE_OPTIONS: --use-system-ca
        with:
          tagName: v__VERSION__
          releaseName: 'LexiKeep v__VERSION__'
          releaseBody: |
            ## LexiKeep v1.1.8

            - 单词页全选现在覆盖当前筛选和搜索结果的全部分页
            - 支持批量或右键将单词从个人列表删除
            - 删除个人单词不会删除文件解析位置或词典数据

            - 修复阅读页无法从下拉列表选择文件夹内文件的问题
            - 阅读页中带下划线的词组现在支持右键快速修改状态
            - 删除文件时自动清理不再被其他文件引用的单词
            - 其他文件仍在使用的单词会保留其学习状态、释义和复习记录
            - Linux、macOS 和 Windows 支持应用内检查、安装更新并自动重启
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: false
          retryAttempts: 2
          args: --bundles deb

  android:
    name: Android APK
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'android' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264"
          yes | sdkmanager --licenses > /dev/null
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate Android project
        run: npx tauri android init
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --use-system-ca
        with:
          tagName: v__VERSION__
          releaseName: 'LexiKeep v__VERSION__'
          releaseBody: |
            ## LexiKeep v1.1.8

            - 单词页全选现在覆盖当前筛选和搜索结果的全部分页
            - 支持批量或右键将单词从个人列表删除
            - 删除个人单词不会删除文件解析位置或词典数据

            - 修复阅读页无法从下拉列表选择文件夹内文件的问题
            - 阅读页中带下划线的词组现在支持右键快速修改状态
            - 删除文件时自动清理不再被其他文件引用的单词
            - 其他文件仍在使用的单词会保留其学习状态、释义和复习记录
            - Linux、macOS 和 Windows 支持应用内检查、安装更新并自动重启
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: false
          retryAttempts: 1
          mobile: android
          args: --apk --target aarch64

  finalize-updater-manifest:
    name: Finalize desktop updater manifest
    needs: [macos, windows, linux, android]
    if: ${{ always() && !cancelled() && needs.macos.result != 'failure' && needs.windows.result != 'failure' && needs.linux.result != 'failure' && needs.android.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download generated updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(jq -r '.version' src-tauri/tauri.conf.json)
          for attempt in 1 2 3 4 5; do
            gh release download "v${version}" --repo "$GITHUB_REPOSITORY" --pattern latest.json --clobber && break
            sleep 5
          done
          test -s latest.json
      - name: Replace API asset URLs with signed installer download URLs
        run: |
          version=$(jq -r '.version' latest.json)
          tag="v${version}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"
          jq \
            --arg version "$version" \
            --arg linux "$base/LexiKeep_${version}_amd64.deb" \
            --arg mac_arm "$base/LexiKeep_${version}_aarch64.app.tar.gz" \
            --arg mac_intel "$base/LexiKeep_${version}_x64.app.tar.gz" \
            --arg windows "$base/LexiKeep_${version}_x64-setup.exe" \
            '
              .platforms |= with_entries(
                .value.url = (
                  if (.key | startswith("linux-")) then $linux
                  elif (.key | startswith("darwin-aarch64")) then $mac_arm
                  elif (.key | startswith("darwin-x86_64")) then $mac_intel
                  elif (.key | startswith("windows-x86_64")) then $windows
                  else .value.url
                  end
                )
              )
              | select(.version == $version)
            ' latest.json > latest.fixed.json
          test -s latest.fixed.json
          jq -e --arg prefix "$base/" '
            [.platforms | to_entries[]
              | select(.key | test("^(linux|darwin|windows)-"))
              | .value.url
              | startswith($prefix)] as $valid
            | ($valid | length > 0) and ($valid | all)
          ' latest.fixed.json
          mv latest.fixed.json latest.json
      - name: Publish finalized updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(jq -r '.version' latest.json)
          gh release upload "v${version}" latest.json --repo "$GITHUB_REPOSITORY" --clobber
